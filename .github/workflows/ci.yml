name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Lint & Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Verify Documentation builds cleanly
        run: cargo doc --locked --workspace --no-deps

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: format-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --verbose

      - name: Build release binary
        run: cargo build --locked --release

      - name: Execute headless snapshot smoke test
        run: cargo run --locked --release -- --offline --snapshot

  package-dry-run:
    name: Package Dry Run (${{ matrix.os }})
    needs: test-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash scripts/package.sh --deb
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile release
        run: cargo build --locked --release

      - name: Test packaging script
        run: ${{ matrix.script }}

      - name: Verify generated archives
        shell: bash
        run: |
          ls -la dist/
          test -n "$(find dist -type f -name '*.tar.gz' -o -name '*.zip')"
          test -n "$(find dist -type f -name '*.sha256')"
          echo "Packaging dry run verified successfully!"
