[workspace]
members = ["crates/*"]
default-members = ["crates/omt-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
omt-core = { path = "crates/omt-core" }
omt-data = { path = "crates/omt-data" }
omt-providers = { path = "crates/omt-providers" }
omt-storage = { path = "crates/omt-storage" }
omt-tui = { path = "crates/omt-tui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "all-widgets", "layout-cache"] }
crossterm = { version = "0.29", features = ["event-stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
directories = "6"
dotenvy = "0.15"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roxmltree = "0.21"

[profile.release]
lto = "thin"
strip = true

